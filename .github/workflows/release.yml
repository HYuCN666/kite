name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Build binary and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN=kite
          if [ "$GOOS" = "windows" ]; then BIN=kite.exe; fi
          mkdir -p pkg/kite/web
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "pkg/kite/$BIN" ./cmd/kite
          cp -r web/dist pkg/kite/web/
          tar -C pkg -czf "kite-$GOOS-$GOARCH.tar.gz" kite

      - uses: softprops/action-gh-release@v2
        with:
          files: kite-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
